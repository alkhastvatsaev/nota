<!DOCTYPE html><html><head><meta charset="utf-8"/><style>:root{--bg:#EEF1F5;--panel:#FFF;--ink:#0F172A;--muted:#64748B;--soft:#94A3B8;--line:rgba(0,0,0,.05);--blue:#2563EB;--blue-bg:#EFF6FF;--blue-text:#1D4ED8;--green-bg:#ECFDF5;--green-text:#047857;--shadow:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);--r:24px}*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}.slide{width:1920px;height:1080px;position:relative;padding:48px 56px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:36px;height:36px;border-radius:11px;background:var(--ink)}.brand b{font-size:16px;font-weight:750}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}h1{font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1.08;max-width:16ch}.lead{font-size:22px;line-height:1.45;color:var(--muted);margin-top:16px;max-width:36ch}.badge{display:inline-flex;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--blue-bg);color:var(--blue-text);border:1px solid #BFDBFE}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.page{position:absolute;right:56px;bottom:32px;font-size:13px;font-weight:700;color:var(--soft)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.layout{display:grid;grid-template-columns:560px 1fr;gap:28px;height:calc(1080px - 160px)}.left{padding:40px 36px;display:flex;flex-direction:column}.step{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}.left h1{font-size:40px;max-width:11ch;margin-bottom:16px}.one{font-size:18px;color:var(--muted);margin-bottom:32px;max-width:22ch}ul{list-style:none;display:flex;flex-direction:column;gap:16px;margin-top:auto}li{font-size:17px;padding:14px 16px;background:#F8FAFC;border:1px solid var(--line);border-radius:14px}.right{padding:16px;display:flex;align-items:center}.frame{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#F8FAFC}.bar{height:30px;background:#F1F5F9;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--soft)}.d{width:9px;height:9px;border-radius:50%}.frame img{display:block;width:100%}</style></head><body><div class="slide"><div class="top"><div class="brand"><img src="logo.png"/><b>CRM Slot</b></div><span class="badge">Carte</span></div><div class="layout"><div class="panel left"><div class="step">Étape 1</div><h1>Tout l'équipe<br/>sur une carte</h1><p class="one">Qui est où, sans demander.</p><ul><li>Techs et courses en live</li><li>Moins d'appels « t'es où ? »</li><li>Assignation plus rapide</li></ul></div><div class="panel right"><div class="frame"><div class="bar"><div class="d" style="background:#FF5F57"></div><div class="d" style="background:#FEBC2E"></div><div class="d" style="background:#28C840"></div><span>Écran de démonstration</span></div><img src="carte.png"/></div></div></div><div class="page">3 / 7</div></div></body></html>
