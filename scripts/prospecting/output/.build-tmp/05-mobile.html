<!DOCTYPE html><html><head><meta charset="utf-8"/><style>:root{--bg:#EEF1F5;--panel:#FFF;--ink:#0F172A;--muted:#64748B;--soft:#94A3B8;--line:rgba(0,0,0,.05);--blue:#2563EB;--blue-bg:#EFF6FF;--blue-text:#1D4ED8;--green-bg:#ECFDF5;--green-text:#047857;--shadow:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);--r:24px}*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}.slide{width:1920px;height:1080px;position:relative;padding:48px 56px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:36px;height:36px;border-radius:11px;background:var(--ink)}.brand b{font-size:16px;font-weight:750}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}h1{font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1.08;max-width:16ch}.lead{font-size:22px;line-height:1.45;color:var(--muted);margin-top:16px;max-width:36ch}.badge{display:inline-flex;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--blue-bg);color:var(--blue-text);border:1px solid #BFDBFE}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.page{position:absolute;right:56px;bottom:32px;font-size:13px;font-weight:700;color:var(--soft)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}.col{padding:28px;text-align:center}.tag{display:inline-flex;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:12px}.admin{background:var(--blue-bg);color:var(--blue-text);border:1px solid #BFDBFE}.tech{background:var(--green-bg);color:var(--green-text);border:1px solid #A7F3D0}.phone{background:var(--ink);border-radius:30px;padding:9px;width:340px;margin:0 auto}.phone img{display:block;width:100%;border-radius:22px}</style></head><body><div class="slide"><div class="top"><div class="brand"><img src="logo.png"/><b>CRM Slot</b></div><span class="badge">Mobile</span></div><div class="eyebrow">Téléphone</div><h1 style="margin-top:12px;font-size:44px">Le patron pilote.<br/>Le tech avance.</h1><div class="row"><div class="panel col"><span class="tag admin">Admin</span><h2 style="font-size:20px;font-weight:800;margin-bottom:16px">Centrale mobile</h2><div class="phone"><img src="mobile-admin.png"/></div></div><div class="panel col"><span class="tag tech">Technicien</span><h2 style="font-size:20px;font-weight:800;margin-bottom:16px">Terrain</h2><div class="phone"><img src="mobile-tech.png"/></div></div></div><div class="page">5 / 7</div></div></body></html>
