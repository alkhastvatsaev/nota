<!DOCTYPE html><html><head><meta charset="utf-8"/><style>:root{--bg:#EEF1F5;--panel:#FFF;--ink:#0F172A;--muted:#64748B;--soft:#94A3B8;--line:rgba(0,0,0,.05);--blue:#2563EB;--blue-bg:#EFF6FF;--blue-text:#1D4ED8;--green-bg:#ECFDF5;--green-text:#047857;--shadow:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);--r:24px}*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}.slide{width:1920px;height:1080px;position:relative;padding:48px 56px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:36px;height:36px;border-radius:11px;background:var(--ink)}.brand b{font-size:16px;font-weight:750}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}h1{font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1.08;max-width:16ch}.lead{font-size:22px;line-height:1.45;color:var(--muted);margin-top:16px;max-width:36ch}.badge{display:inline-flex;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--blue-bg);color:var(--blue-text);border:1px solid #BFDBFE}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.page{position:absolute;right:56px;bottom:32px;font-size:13px;font-weight:700;color:var(--soft)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:48px}.card{padding:36px 32px;min-height:460px}.num{font-size:56px;font-weight:800;color:#CBD5E1;margin-bottom:28px}.card h2{font-size:26px;font-weight:800;margin-bottom:14px}.card p{font-size:18px;line-height:1.5;color:var(--muted)}</style></head><body><div class="slide"><div class="top"><div class="brand"><img src="logo.png"/><b>CRM Slot</b></div><span class="badge">Constat</span></div><div class="eyebrow">Terrain</div><h1 style="margin-top:12px">Trois endroits où<br/>l'argent se perd</h1><div class="grid"><div class="panel card"><div class="num">01</div><h2>Missions éparpillées</h2><p>Téléphone, WhatsApp, papier.</p></div><div class="panel card"><div class="num">02</div><h2>Dossiers flous</h2><p>Client, adresse — reconstruits de mémoire.</p></div><div class="panel card"><div class="num">03</div><h2>Factures en retard</h2><p>La course est faite, le cash attend.</p></div></div><div class="page">2 / 7</div></div></body></html>
