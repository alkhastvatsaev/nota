name: Testing & Typechecking

# Filet de sécurité nightly + PR — le filet principal reste `npm run ci` en local.
# Plus de déclenchement par push : 453 pushes/mois × ~19 min explosaient le quota gratuit GitHub.
on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run CI (lint, typecheck, tests, build)
      run: npm run ci
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
        NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder
